name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify repository legal boundary
        shell: pwsh
        run: ./tools/Verify-Repository.ps1

      - name: Build and run tests
        shell: cmd
        run: Run Tests.bat

      - name: Publish self-contained Windows package
        shell: pwsh
        run: ./tools/Publish-Windows.ps1 -SkipArchive

      - name: Install pinned installer compiler
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          $compilerRoot = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $installer
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notlike '*Pyrsys B.V.*') {
            throw "Unexpected Inno Setup signature: $($signature.Status) $($signature.SignerCertificate.Subject)"
          }
          $install = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/SP-', '/NORESTART', "/DIR=`"$compilerRoot`"") -Wait -PassThru -WindowStyle Hidden
          if ($install.ExitCode -ne 0) { throw "Inno Setup installation returned $($install.ExitCode)" }
          "INNO_COMPILER=$compilerRoot\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Windows installer
        shell: pwsh
        run: ./tools/Build-WindowsInstaller.ps1 -SkipPackage -Compiler "$env:INNO_COMPILER"

      - name: Smoke-test Windows installer
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP 'ReConqueror-installer-test'
          $setup = Start-Process -FilePath 'artifacts/ReConqueror1086-Setup.exe' -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOICONS', '/NOIMPORT=1', "/DIR=`"$testRoot`"") -Wait -PassThru -WindowStyle Hidden
          if ($setup.ExitCode -ne 0) { throw "Installer returned $($setup.ExitCode)" }
          $game = Start-Process -FilePath (Join-Path $testRoot 'Game/Conqueror.Game.exe') -ArgumentList '--smoke-test' -WorkingDirectory $testRoot -Wait -PassThru -WindowStyle Hidden
          if ($game.ExitCode -ne 0) { throw "Packaged game returned $($game.ExitCode)" }
          $uninstall = Start-Process -FilePath (Join-Path $testRoot 'unins000.exe') -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru -WindowStyle Hidden
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller returned $($uninstall.ExitCode)" }

      - name: Upload clean-room Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Conqueror1086-win-x64
          path: artifacts/Conqueror1086-win-x64
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ReConqueror1086-Setup
          path: artifacts/ReConqueror1086-Setup.exe
          if-no-files-found: error

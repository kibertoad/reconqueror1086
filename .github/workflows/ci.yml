name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify repository legal boundary
        shell: pwsh
        run: ./tools/Verify-Repository.ps1

      - name: Build and run tests
        shell: cmd
        run: Run Tests.bat

name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
          - name: Linux x64
            os: ubuntu-latest
          - name: macOS arm64
            os: macos-15
          - name: macOS x64
            os: macos-15-intel

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify repository legal boundary
        shell: pwsh
        run: ./tools/Verify-Repository.ps1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-evidence.txt
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run canonical fast validation
        shell: pwsh
        run: ./tools/Invoke-Validation.ps1

      - name: Publish assetless game
        run: dotnet publish src/Conqueror.Game/Conqueror.Game.csproj --artifacts-path artifacts/validation -c Release --output artifacts/assetless-game -v minimal

      - name: Verify proprietary media boundary
        shell: pwsh
        run: |
          $contentDirectory = Join-Path $PWD 'artifacts/assetless-game/UserContent'
          if (Test-Path -LiteralPath $contentDirectory) {
            throw "Assetless publish unexpectedly contains UserContent: $contentDirectory"
          }

      - name: Smoke-test published entry point
        run: dotnet artifacts/assetless-game/Conqueror.Game.dll --smoke-test

  documentation:
    name: Documentation standard
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so the check can find where a pull request forked from main and fail
          # when it deletes a spec ID, area or deviation that exists there.
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify pinned offline tooling
        run: node tools/upstream.mjs verify
      # The action runs the checker source at this toolkit commit. tools/upstream-lock.json records
      # the commit and the @scientific-method/standard-checker version it carries, which package.json
      # pins for local runs; `node tools/upstream.mjs refresh` moves all three together. The commit
      # carries a package release tag rather than an action version, so the pin has no version comment.
      - uses: kibertoad/refurbished-dinosaurs-toolkit/actions/check-documentation@a260e391fe2dea67f0034d5480e2bb439b0663ac # zizmor: ignore[stale-action-refs,ref-version-mismatch]

      - name: Check narrative references
        run: node tools/Check-NarrativeReferences.mjs

  package-windows:
    name: Windows installer
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400

      - name: Verify repository legal boundary
        shell: pwsh
        run: ./tools/Verify-Repository.ps1

      - name: Install pinned installer compiler
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          $compilerRoot = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          gh release download is-7_1_0 `
            --repo jrsoftware/issrc `
            --pattern 'innosetup-7.1.0-x64.exe' `
            --dir $env:RUNNER_TEMP
          gh release verify-asset $installer --repo jrsoftware/issrc
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid' -or
              $signature.SignerCertificate.Subject -notlike '*Pyrsys B.V.*') {
            throw "Unexpected Inno Setup signature: $($signature.Status) $($signature.SignerCertificate.Subject)"
          }
          $install = Start-Process -FilePath $installer `
            -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/SP-', '/NORESTART', "/DIR=`"$compilerRoot`"") `
            -Wait -PassThru -WindowStyle Hidden
          if ($install.ExitCode -ne 0) {
            throw "Inno Setup installation returned $($install.ExitCode)."
          }
          "INNO_COMPILER=$compilerRoot\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Hosted runners expose only the GDI generic OpenGL renderer, which has no framebuffer objects,
      # so MonoGame cannot create a graphics device. The toolkit's action installs checksum-verified
      # Mesa llvmpipe under RUNNER_TEMP and fails the step if it cannot, so the platform smoke tests
      # never silently run against the runner's own driver. Toolkit actions are pinned by commit and
      # carry no version of their own; the commit's only tag names a package release.
      - name: Provision software OpenGL for the platform smoke test
        id: software-opengl
        uses: kibertoad/refurbished-dinosaurs-toolkit/actions/setup-software-opengl@6ab530df7851354c98e833a2beb76dbe0f71e421 # zizmor: ignore[ref-version-mismatch]
      - name: Hand the driver to the platform smoke test
        shell: pwsh
        env:
          DRIVER_PATH: ${{ steps.software-opengl.outputs.driver-path }}
        run: |
          "PLATFORM_SMOKE_TEST_GL_DRIVER=$env:DRIVER_PATH" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Software OpenGL driver provisioned at $env:DRIVER_PATH"
      - name: Build Windows installer
        shell: pwsh
        run: ./tools/Build-WindowsInstaller.ps1 -Compiler "$env:INNO_COMPILER"

      - name: Smoke-test Windows installer
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP 'ReConqueror-installer-test'
          $setup = Start-Process -FilePath 'artifacts/ReConqueror1086-Setup-0.1.0.exe' `
            -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOIMPORT=1', "/DIR=`"$testRoot`"") `
            -Wait -PassThru -WindowStyle Hidden
          if ($setup.ExitCode -ne 0) { throw "Installer returned $($setup.ExitCode)." }
          $license = Join-Path $testRoot 'docs/licenses/scientific-method-MIT.txt'
          if (-not (Test-Path -LiteralPath $license) -or
              (Get-FileHash $license).Hash -ne (Get-FileHash 'docs/licenses/scientific-method-MIT.txt').Hash) {
            throw 'Windows installer omitted or changed the toolkit license.'
          }
          $shortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\ReConqueror A.D. 1086\ReConqueror A.D. 1086.lnk'
          if (-not [IO.File]::Exists($shortcut)) { throw "Installer did not create $shortcut." }
          $link = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcut)
          $expectedTarget = [IO.Path]::GetFullPath((Join-Path $testRoot 'Game/Conqueror.Game.exe'))
          if ([IO.Path]::GetExtension($link.TargetPath) -ne '.exe' -or
              [IO.Path]::GetFullPath($link.TargetPath) -ne $expectedTarget) {
            throw "Shortcut target '$($link.TargetPath)' is not '$expectedTarget'."
          }
          foreach ($nativeLibrary in @('SDL2.dll', 'openal.dll')) {
            $nativePath = Join-Path (Split-Path -Parent $link.TargetPath) $nativeLibrary
            if (-not [IO.File]::Exists($nativePath)) { throw "Installed native library is missing: $nativePath" }
          }
          $smokeArguments = @('--platform-smoke-test')
          if ($env:PLATFORM_SMOKE_TEST_GL_DRIVER) { $smokeArguments += '--software-renderer' }
          $smokeOut = Join-Path $env:RUNNER_TEMP 'platform-smoke-out.txt'
          $smokeErr = Join-Path $env:RUNNER_TEMP 'platform-smoke-err.txt'
          $game = Start-Process -FilePath $link.TargetPath -ArgumentList $smokeArguments `
            -WorkingDirectory $link.WorkingDirectory -PassThru -WindowStyle Hidden `
            -RedirectStandardOutput $smokeOut -RedirectStandardError $smokeErr
          if (-not $game.WaitForExit(120000)) {
            Get-Content $smokeOut, $smokeErr -ErrorAction SilentlyContinue | Write-Host
            $game.Kill($true)
            throw 'Installed native-platform check timed out.'
          }
          if ($game.ExitCode -ne 0) {
            Get-Content $smokeOut, $smokeErr -ErrorAction SilentlyContinue | Write-Host
            throw "Installed native-platform check returned $($game.ExitCode)."
          }
          $uninstall = Start-Process -FilePath (Join-Path $testRoot 'unins000.exe') `
            -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') `
            -Wait -PassThru -WindowStyle Hidden
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller returned $($uninstall.ExitCode)." }
          if ([IO.File]::Exists($shortcut)) { throw 'Uninstaller left the Start menu shortcut behind.' }

      - name: Upload clean-room Windows package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ReConqueror1086-win-x64
          path: artifacts/Conqueror1086-win-x64
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ReConqueror1086-Windows-Setup
          path: artifacts/ReConqueror1086-Setup-0.1.0.exe
          if-no-files-found: error

  package-linux:
    name: Linux installer
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400

      - name: Verify repository legal boundary
        shell: pwsh
        run: ./tools/Verify-Repository.ps1

      - name: Build Debian installer
        shell: pwsh
        run: ./tools/Build-LinuxInstaller.ps1

      - name: Verify installed filesystem layout
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP 'reconqueror-deb-test'
          dpkg-deb --info artifacts/ReConqueror1086-linux-x64-Setup-0.1.0.deb
          if ($LASTEXITCODE -ne 0) { throw 'Debian package metadata is invalid.' }
          dpkg-deb --extract artifacts/ReConqueror1086-linux-x64-Setup-0.1.0.deb $testRoot
          if ($LASTEXITCODE -ne 0) { throw 'Debian package extraction failed.' }
          $license = Join-Path $testRoot 'opt/reconqueror-ad-1086/docs/licenses/scientific-method-MIT.txt'
          if (-not (Test-Path -LiteralPath $license) -or
              (Get-FileHash $license).Hash -ne (Get-FileHash 'docs/licenses/scientific-method-MIT.txt').Hash) {
            throw 'Debian installer omitted or changed the toolkit license.'
          }
          & (Join-Path $testRoot 'opt/reconqueror-ad-1086/Game/Conqueror.Game') --smoke-test
          if ($LASTEXITCODE -ne 0) { throw 'Installed Debian game smoke test failed.' }

      - name: Upload Linux installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ReConqueror1086-linux-x64-Setup
          path: artifacts/ReConqueror1086-linux-x64-Setup-0.1.0.deb
          if-no-files-found: error

  package-macos:
    name: macOS installer (${{ matrix.arch }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-15
            runtime: osx-arm64
          - arch: x64
            os: macos-15-intel
            runtime: osx-x64

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400

      - name: Verify repository legal boundary
        shell: pwsh
        run: ./tools/Verify-Repository.ps1

      - name: Build macOS installer
        shell: pwsh
        env:
          TARGET_RUNTIME: ${{ matrix.runtime }}
        run: ./tools/Build-MacInstaller.ps1 -Runtime $env:TARGET_RUNTIME

      - name: Verify package structure
        shell: pwsh
        env:
          TARGET_RUNTIME: ${{ matrix.runtime }}
        run: |
          $package = "artifacts/ReConqueror1086-$env:TARGET_RUNTIME-Setup-0.1.0.pkg"
          $expanded = Join-Path $env:RUNNER_TEMP "reconqueror-$env:TARGET_RUNTIME-pkg"
          pkgutil --expand-full $package $expanded
          if ($LASTEXITCODE -ne 0) { throw 'macOS package expansion failed.' }
          $executable = Get-ChildItem -LiteralPath $expanded -Recurse -Filter 'Conqueror.Game' |
            Select-Object -First 1
          if (-not $executable) { throw 'macOS package does not contain the game executable.' }
          $license = Get-ChildItem -LiteralPath $expanded -Recurse -Filter 'scientific-method-MIT.txt' |
            Select-Object -First 1
          if (-not $license -or
              (Get-FileHash $license.FullName).Hash -ne (Get-FileHash 'docs/licenses/scientific-method-MIT.txt').Hash) {
            throw 'macOS installer omitted or changed the toolkit license.'
          }

      - name: Upload macOS installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ReConqueror1086-${{ matrix.runtime }}-Setup
          path: artifacts/ReConqueror1086-${{ matrix.runtime }}-Setup-0.1.0.pkg
          if-no-files-found: error
